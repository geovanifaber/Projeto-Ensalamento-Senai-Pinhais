<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja de Músicas & Beats</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 20px;
      margin-bottom: 30px;
    }

    main {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
    }

    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .music-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .music-card {
      background-color: #1e1e1e;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .music-card h3 {
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    .music-card p {
      color: #aaaaaa;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .music-card .price {
      color: #1db954;
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    button {
      background-color: #1db954;
      color: #000000;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      background-color: #555555;
      cursor: not-allowed;
    }

    .cart-section {
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      height: fit-content;
    }

    .cart-section ul {
      list-style: none;
      margin: 15px 0;
    }

    .cart-section li {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .order-status {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #1db954;
    }
  </style>
</head>
<body>
  <header>
    <h1>BeatStore</h1>
    <div class="cart-status">
      Carrinho: <span id="cart-count">0</span> item(ns)
    </div>
  </header>

  <main>
    <section class="catalog-section">
      <h2>Catálogo de Faixas</h2>
      <div id="music-list" class="music-grid"></div>
    </section>

    <aside class="cart-section">
      <h2>Seu Pedido</h2>
      <ul id="cart-items"></ul>
      <p>Total: R$ <span id="cart-total">0.00</span></p>
      <button id="checkout-btn" disabled>Finalizar Compra</button>
      <div id="order-status" class="order-status"></div>
    </aside>
  </main>

  <script>
    const musics = [
      { id: 1, title: "Midnight Chill", genre: "Lo-Fi", price: 29.90 },
      { id: 2, title: "Cyber Horizon", genre: "Synthwave", price: 34.90 },
      { id: 3, title: "Trap Anthem", genre: "Trap", price: 39.90 },
      { id: 4, title: "Deep Echoes", genre: "Techno", price: 25.00 }
    ];

    let cart = [];

    const musicList = document.getElementById("music-list");
    const cartItems = document.getElementById("cart-items");
    const cartCount = document.getElementById("cart-count");
    const cartTotal = document.getElementById("cart-total");
    const checkoutBtn = document.getElementById("checkout-btn");
    const orderStatus = document.getElementById("order-status");

    function renderCatalog() {
      musicList.innerHTML = "";
      musics.forEach(music => {
        const card = document.createElement("div");
        card.classList.add("music-card");
        card.innerHTML = `
          <div>
            <h3>${music.title}</h3>
            <p>${music.genre}</p>
          </div>
          <div>
            <div class="price">R$ ${music.price.toFixed(2)}</div>
            <button class="add-btn" data-id="${music.id}">Comprar Licença</button>
          </div>
        `;
        musicList.appendChild(card);
      });

      document.querySelectorAll(".add-btn").forEach(button => {
        button.addEventListener("click", (e) => {
          const id = Number(e.target.getAttribute("data-id"));
          addToCart(id);
        });
      });
    }

    function addToCart(musicId) {
      const selectedMusic = musics.find(item => item.id === musicId);
      if (selectedMusic) {
        cart.push(selectedMusic);
        updateCartUI();
        orderStatus.textContent = "";
      }
    }

    function updateCartUI() {
      cartItems.innerHTML = "";
      let total = 0;

      cart.forEach(item => {
        total += item.price;
        const li = document.createElement("li");
        li.innerHTML = `
          <span>${item.title}</span>
          <span>R$ ${item.price.toFixed(2)}</span>
        `;
        cartItems.appendChild(li);
      });

      cartCount.textContent = cart.length;
      cartTotal.textContent = total.toFixed(2);
      checkoutBtn.disabled = cart.length === 0;
    }

    checkoutBtn.addEventListener("click", () => {
      const codigo = Math.floor(1000 + Math.random() * 9000);
      orderStatus.textContent = `Pedido #${codigo} realizado com sucesso!`;
      cart = [];
      updateCartUI();
    });

    renderCatalog();
  </script>
</body>
</html>
